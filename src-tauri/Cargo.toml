[package]
name = "handy"
version = "0.1.2"
description = "Run local development services from one place"
authors = ["Handy contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "handy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:libc", "dep:serde_json", "dep:tauri", "dep:tauri-plugin-dialog", "dep:tokio"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"], optional = true }
