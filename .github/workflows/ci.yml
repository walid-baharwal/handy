name: ci

on: [push, pull_request]

jobs:
  checks:
    name: Checks (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb,rpm,appimage
          - platform: windows-2022
            bundles: nsis
          - platform: macos-15-intel
            bundles: dmg
          - platform: macos-15
            bundles: dmg
    runs-on: ${{ matrix.platform }}
    env:
      APPLE_SIGNING_IDENTITY: "-"

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev pkg-config patchelf rpm libfuse2

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test:frontend
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: pnpm tauri build --bundles ${{ matrix.bundles }}
